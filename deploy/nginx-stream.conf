# Include inside the existing stream block; preserve the first-IP proxy server.
map $ssl_preread_server_name $nuckty_tls_backend {
    nuckty.ru 127.0.0.1:8445;
    nuckty.com 127.0.0.1:8445;
    demo.nuckty.ru 127.0.0.1:8445;
    demo.nuckty.com 127.0.0.1:8445;
    default 10.130.0.37:9000;
}
server {
    listen 10.130.0.37:443;
    ssl_preread on;
    proxy_pass $nuckty_tls_backend;
    proxy_connect_timeout 10s;
    proxy_timeout 1h;
}

