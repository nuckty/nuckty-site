server {
    listen 127.0.0.1:8445 ssl;
    listen 127.0.0.1:8087;
    server_name nuckty.ru;
    ssl_certificate /etc/letsencrypt/live/nuckty-sites/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nuckty-sites/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/nuckty/site/current/ru;
    error_page 404 /__nuckty_404;
    include /etc/nginx/snippets/nuckty-locations.conf;
}
