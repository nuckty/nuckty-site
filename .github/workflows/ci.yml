name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: nuckty-site
      - name: Pin the latest successfully verified documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: node nuckty-site/.github/resolve-sources.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nuckty-site/package-lock.json
      - name: Require system Java before installing validator dependencies
        run: java -version
      - name: Install website dependencies
        working-directory: nuckty-site
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Audit website lockfile
        working-directory: nuckty-site
        run: npm audit --package-lock-only --audit-level=low --registry=https://registry.npmjs.org
      - name: Prepare the pinned documentation source
        working-directory: nuckty-site
        run: npx nuckty content-external
      - name: Build and verify immutable website artifacts
        working-directory: nuckty-site
        run: |
          python3 -m unittest discover -s deploy -p 'test_*.py'
          npm run build
          npm run lint
          npm test
          npm run validate
          NUCKTY_NPM_CACHE="$(npm config get cache)" npm run test:starter -- --extensions
          NUCKTY_NPM_CACHE="$(npm config get cache)" npm run test:starter -- --offline
      - name: Save RU static site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuckty-site-ru-${{ github.sha }}
          path: nuckty-site/site/ru/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Save EN static site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuckty-site-en-${{ github.sha }}
          path: nuckty-site/site/en/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Deploy verified static artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DEPLOY_KEY: ${{ secrets.NUCKTY_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ vars.NUCKTY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.NUCKTY_DEPLOY_USER }}
          KNOWN_HOSTS: ${{ vars.NUCKTY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$KNOWN_HOSTS"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$stage/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$stage/known_hosts"
          cp -a nuckty-site/site/ru "$stage/ru"
          cp -a nuckty-site/site/en "$stage/en"
          tar -C "$stage" -czf - ru en | ssh -i "$stage/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$stage/known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA $GITHUB_RUN_ID"
